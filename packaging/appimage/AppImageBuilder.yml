version: 1

script:
  - PROJECT_DIR="${VOICETYPING_PROJECT_DIR:?VOICETYPING_PROJECT_DIR is required}"
  - WHEEL_PATH="${VOICETYPING_WHEEL:?VOICETYPING_WHEEL is required}"
  - rm -rf "$TARGET_APPDIR"
  - mkdir -p "$TARGET_APPDIR/usr/bin" "$TARGET_APPDIR/usr/share/applications" "$TARGET_APPDIR/usr/share/icons/hicolor/scalable/apps" "$TARGET_APPDIR/usr/share/metainfo"
  - install -m 0755 "$PROJECT_DIR/packaging/appimage/voicetyping-launcher" "$TARGET_APPDIR/usr/bin/voicetyping-launcher"
  - python3 -m pip install --disable-pip-version-check --no-cache-dir --ignore-installed --require-hashes --prefix=/usr --root="$TARGET_APPDIR" --requirement "$PROJECT_DIR/requirements.txt"
  - python3 -m pip install --disable-pip-version-check --no-cache-dir --ignore-installed --no-deps --prefix=/usr --root="$TARGET_APPDIR" "$WHEEL_PATH"
  - install -m 0644 "$PROJECT_DIR/packaging/io.github.fadayat.voicetyping.desktop" "$TARGET_APPDIR/usr/share/applications/io.github.fadayat.voicetyping.desktop"
  - install -m 0644 "$PROJECT_DIR/packaging/voicetyping.svg" "$TARGET_APPDIR/usr/share/icons/hicolor/scalable/apps/voicetyping.svg"
  - install -m 0644 "$PROJECT_DIR/packaging/io.github.fadayat.voicetyping.metainfo.xml" "$TARGET_APPDIR/usr/share/metainfo/io.github.fadayat.voicetyping.metainfo.xml"

AppDir:
  path: ./AppDir

  app_info:
    id: io.github.fadayat.voicetyping
    name: VoiceTyping
    icon: voicetyping
    # Replaced from voicetyping.__version__ by build-appimage.sh.
    version: 0.0.0
    # AppRun v2 resolves its architecture from an ELF main executable. The
    # build script restores the argument-preserving launcher in AppRun.env
    # after appimage-builder finishes its runtime setup.
    exec: usr/bin/python3
    exec_args: "-m voicetyping.app $@"

  apt:
    arch:
      - amd64
    sources:
      - sourceline: deb [arch=amd64] https://archive.ubuntu.com/ubuntu/ jammy main universe
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: deb [arch=amd64] https://archive.ubuntu.com/ubuntu/ jammy-updates main universe
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
      - sourceline: deb [arch=amd64] https://security.ubuntu.com/ubuntu/ jammy-security main universe
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
    include:
      - python3
      - python3-tk
      - python3-gi
      - python3-gi-cairo
      - python3-cairo
      - gir1.2-gtk-3.0
      - gir1.2-ayatanaappindicator3-0.1
      - libportaudio2
      - libsndfile1
      - wl-clipboard
      - xclip
    exclude: []

  runtime:
    env:
      LD_LIBRARY_PATH: '${APPDIR}/usr/lib/x86_64-linux-gnu:${APPDIR}/usr/lib:${APPDIR}/lib/x86_64-linux-gnu:${APPDIR}/lib'
      PYTHONHOME: '${APPDIR}/usr'
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: '${APPDIR}/usr/lib/python3.10/site-packages'
      GI_TYPELIB_PATH: '${APPDIR}/usr/lib/x86_64-linux-gnu/girepository-1.0'

AppImage:
  arch: x86_64
  update-information: gh-releases-zsync|fadayat|voicetyping|latest|VoiceTyping-*-x86_64.AppImage.zsync
