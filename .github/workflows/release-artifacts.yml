name: Build release artifacts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_call:
    inputs:
      publish_draft:
        description: Create a GitHub draft release after both packages pass.
        required: false
        type: boolean
        default: false
      expected_version:
        description: Version validated by the tag-triggered caller.
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-wheel:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'build-release-artifacts'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libportaudio2 python3-cairo python3-gi \
            python3-gi-cairo python3-tk gir1.2-gtk-3.0 build-essential \
            python3-dev linux-libc-dev
      - name: Install locked development dependencies
        run: |
          uv venv --python python3 --system-site-packages
          uv sync --locked
      - name: Validate source and tests
        run: uv run --locked python scripts/release_harness.py source
      - name: Build release wheel
        run: uv build --wheel --out-dir dist
      - name: Validate wheel
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          VERSION="$(python3 -c 'from scripts.release_harness import read_package_version; print(read_package_version())')"
          if [[ -n "$EXPECTED_VERSION" && "$EXPECTED_VERSION" != "$VERSION" ]]; then
            echo "Requested version $EXPECTED_VERSION does not match package version $VERSION." >&2
            exit 1
          fi
          uv run --locked python scripts/release_harness.py wheel \
            --wheel dist/voicetyping-*.whl --version "$VERSION"
          WHEEL="$(find dist -maxdepth 1 -type f -name 'voicetyping-*.whl' -print -quit)"
          test -n "$WHEEL"
          (
            cd dist
            sha256sum "$(basename "$WHEEL")" > "$(basename "$WHEEL").sha256"
            sha256sum --check "$(basename "$WHEEL").sha256"
          )
      - uses: actions/upload-artifact@v7
        with:
          name: voicetyping-wheel
          path: |
            dist/voicetyping-*.whl
            dist/voicetyping-*.whl.sha256
          if-no-files-found: error

  appimage:
    needs: validate-wheel
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: voicetyping-wheel
          path: dist
      - name: Install pinned AppImage build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential python3-dev python3-pip binutils file \
            linux-libc-dev gtk-update-icon-cache libglib2.0-bin
          curl --fail --location --retry 3 \
            --output /tmp/pip-26.3-py3-none-any.whl \
            https://files.pythonhosted.org/packages/07/25/ee8c38ae72d66b844ce8eb9711ba905dba21ca1a8a0c960057c41cd23337/pip-26.3-py3-none-any.whl
          echo "f3b60b20ffaadd4415ed7957212a38ac63fa4c5fa375bd0f4a797777940fad13  /tmp/pip-26.3-py3-none-any.whl" | sha256sum --check
          sudo python3 -m pip install --no-index --no-deps --upgrade /tmp/pip-26.3-py3-none-any.whl
          python3 -m pip --version | grep -F 'pip 26.3 '
          curl --fail --location --retry 3 \
            --output /tmp/appimage-builder.AppImage \
            https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
          echo "4b4f99cae9291d78ba12dbdabca7c0a67c72aa61eb2e5d424089171a9485e96f  /tmp/appimage-builder.AppImage" | sha256sum --check
          chmod +x /tmp/appimage-builder.AppImage
          curl --fail --location --retry 3 \
            --output /tmp/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool-x86_64.AppImage" | sha256sum --check
          chmod +x /tmp/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 \
            --output /tmp/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/runtime-x86_64" | sha256sum --check
          chmod +x /tmp/runtime-x86_64
          curl --fail --location --retry 3 \
            --output /tmp/AppRun-Release-x86_64 \
            https://github.com/AppImageCrafters/AppRun/releases/download/v2.0.0/AppRun-Release-x86_64
          echo "c74e7e3a085c624260f0d144c02968d00fa9383f5d7fc46b32f1dc80d371d7ff  /tmp/AppRun-Release-x86_64" | sha256sum --check
          chmod +x /tmp/AppRun-Release-x86_64
          curl --fail --location --retry 3 \
            --output /tmp/libapprun_hooks-Release-x86_64.so \
            https://github.com/AppImageCrafters/AppRun/releases/download/v2.0.0/libapprun_hooks-Release-x86_64.so
          echo "1f64dd2161be3242f106c891b2daf27bbdd2103c20b28f57f61a56cdccb1eb6a  /tmp/libapprun_hooks-Release-x86_64.so" | sha256sum --check
      - name: Build and validate AppImage
        env:
          APPIMAGE_BUILDER: /tmp/appimage-builder.AppImage
          APPIMAGE_BUILDER_APPRUN: /tmp/AppRun-Release-x86_64
          APPIMAGE_BUILDER_HOOKS: /tmp/libapprun_hooks-Release-x86_64.so
          APPIMAGETOOL: /tmp/appimagetool-x86_64.AppImage
          APPIMAGE_RUNTIME: /tmp/runtime-x86_64
        run: |
          VERSION="$(python3 -c 'from scripts.release_harness import read_package_version; print(read_package_version())')"
          VOICETYPING_WHEEL="$PWD/dist/$(basename dist/voicetyping-*.whl)" \
            ./packaging/appimage/build-appimage.sh "$VERSION"
          python3 scripts/release_harness.py appimage \
            "dist/VoiceTyping-${VERSION}-x86_64.AppImage" --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: voicetyping-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.AppImage.zsync
          if-no-files-found: error

  deb:
    needs: validate-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: voicetyping-wheel
          path: dist
      - name: Install Debian build tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential python3-dev python3-pip
      - name: Build and validate Debian package
        run: |
          VERSION="$(python3 -c 'from scripts.release_harness import read_package_version; print(read_package_version())')"
          VOICETYPING_WHEEL="$PWD/dist/$(basename dist/voicetyping-*.whl)" \
            ./packaging/deb/build-deb.sh "$VERSION"
          sudo python3 scripts/release_harness.py deb \
            "dist/voicetyping_${VERSION}-1_ubuntu24.04_amd64.deb" --version "$VERSION" --install
      - uses: actions/upload-artifact@v7
        with:
          name: voicetyping-deb
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  draft-release:
    if: ${{ inputs.publish_draft == true }}
    needs: [appimage, deb]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: voicetyping-*
          path: release-assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(mktemp)"
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"
          if [[ ! -s "$NOTES" ]]; then
            echo "No changelog section found for $VERSION." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft --verify-tag --title "VoiceTyping $VERSION" --notes-file "$NOTES"
