name: Source and wheel checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Install desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libportaudio2 python3-cairo python3-gi \
            python3-gi-cairo python3-tk gir1.2-gtk-3.0 build-essential \
            python3-dev linux-libc-dev
      - name: Install locked development dependencies
        run: |
          uv venv --system-site-packages
          uv sync --locked
      - name: Validate source and tests
        run: uv run --locked python scripts/release_harness.py source
      - name: Build one wheel
        run: uv build --wheel --out-dir dist
      - name: Validate installed wheel
        run: uv run --locked python scripts/release_harness.py wheel --wheel dist/voicetyping-*.whl
