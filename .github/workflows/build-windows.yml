name: Build Windows package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test and package
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoiceTyping-windows-x64
          if-no-files-found: warn
          path: |
            dist/VoiceTyping-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/SELFTEST.json
            dist/GEMINI_SMOKE.json
