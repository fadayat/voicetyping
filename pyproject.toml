[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetyping"
dynamic = ["version"]
description = "Linux desktop voice typing with Gemini transcription"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.17.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyperclip>=1.8.2",
    "pynput>=1.7.6",
    "pystray>=0.19.4",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[project.scripts]
voicetyping = "voicetyping.app:main"
voicetyping-toggle = "voicetyping.voicetyping_toggle:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "voicetyping.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
