[project]
name = "voicetyping"
version = "2.2.0"
description = "Linux desktop voice typing with Gemini transcription"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.17.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyperclip>=1.8.2",
    "pynput>=1.7.6",
    "pystray>=0.19.4",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[tool.uv]
package = false
